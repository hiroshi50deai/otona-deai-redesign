<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="1402" viewBox="0 0 1122 1402" role="img" aria-labelledby="title desc">
  <title id="title">プロフィール写真で清潔感や安心感が伝わっていない</title>
  <desc id="desc">マッチングアプリでは写真の数秒で清潔感、安心感、話しかけやすさが判断されることを説明する図解。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff7f8"/><stop offset="1" stop-color="#fffdf8"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8799a"/><stop offset="1" stop-color="#f59ab0"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#152a4d" flood-opacity="0.12"/></filter>
    <style><![CDATA[
      .navy{fill:#152a4d}.pink{fill:#e8799a}.brown{fill:#5f463e}.muted{fill:#6b7280}.white{fill:#fff}
      .title{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;font-weight:900;letter-spacing:.02em}
      .text{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;font-weight:700;letter-spacing:.02em}
      .small{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;font-weight:600;letter-spacing:.02em}
    ]]></style>
  </defs>
  <rect width="1122" height="1402" rx="34" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="95" fill="#fde7ed" opacity=".7"/>
  <circle cx="80" cy="1280" r="120" fill="#fde7ed" opacity=".45"/>

  <rect x="36" y="32" width="146" height="56" rx="14" fill="url(#pink)"/>
  <text x="109" y="71" text-anchor="middle" class="title white" font-size="28">理由1</text>
  <text x="206" y="72" class="title navy" font-size="46">プロフィール写真で</text>
  <text x="36" y="134" class="title navy" font-size="54">清潔感や安心感が伝わっていない</text>
  <text x="38" y="190" class="text brown" font-size="28">マッチングアプリで最初に見られるのは、ほぼ写真です</text>

  <g transform="translate(858,56)">
    <circle cx="104" cy="94" r="76" fill="#f8d7df"/>
    <path d="M43 88c3-55 42-80 86-64 38 14 50 50 37 93-14 49-81 57-110 24-13-15-15-34-13-53z" fill="#3e302b"/>
    <circle cx="96" cy="93" r="52" fill="#ffe4cc"/>
    <circle cx="76" cy="90" r="8" class="brown"/><circle cx="116" cy="90" r="8" class="brown"/>
    <path d="M78 117q22 20 44 0" fill="none" stroke="#5f463e" stroke-width="6" stroke-linecap="round"/>
    <path d="M58 162h86q36 0 46 36l22 86H-2l22-86q10-36 38-36z" fill="#f7aebc"/>
    <rect x="63" y="164" width="80" height="122" fill="#fff"/>
    <path d="M40 200q-38 10-45 48" fill="none" stroke="#ffe4cc" stroke-width="26" stroke-linecap="round"/>
    <path d="M14 238l-38-12" stroke="#152a4d" stroke-width="6" stroke-linecap="round"/>
    <text x="104" y="338" text-anchor="middle" class="small navy" font-size="22">さくら</text>
  </g>

  <rect x="72" y="238" width="708" height="104" rx="24" fill="#fff" stroke="#e8799a" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="128" cy="290" r="34" fill="#e8799a"/>
  <text x="128" y="302" text-anchor="middle" class="title white" font-size="42">秒</text>
  <text x="186" y="282" class="title navy" font-size="32">写真の数秒で</text>
  <text x="378" y="282" class="title pink" font-size="36">「会っても大丈夫そうか」</text>
  <text x="186" y="321" class="text brown" font-size="26">が判断されます</text>

  <rect x="46" y="390" width="1030" height="438" rx="28" fill="#fff" stroke="#152a4d" stroke-width="4" filter="url(#shadow)"/>
  <rect x="154" y="374" width="814" height="58" rx="28" fill="#152a4d"/>
  <text x="561" y="413" text-anchor="middle" class="title white" font-size="32">女性が写真から見ているポイント</text>

  <g class="text navy" font-size="25" text-anchor="middle">
    <g transform="translate(74,462)"><rect width="292" height="142" rx="20" fill="#fff" stroke="#e5e7eb"/><circle cx="42" cy="38" r="28" fill="#152a4d"/><text x="42" y="48" fill="#fff" font-size="30">1</text><text x="146" y="72">髪は</text><text x="146" y="108">整っているか</text></g>
    <g transform="translate(415,462)"><rect width="292" height="142" rx="20" fill="#fff" stroke="#e5e7eb"/><circle cx="42" cy="38" r="28" fill="#152a4d"/><text x="42" y="48" fill="#fff" font-size="30">2</text><text x="146" y="72">服に</text><text x="146" y="108">清潔感があるか</text></g>
    <g transform="translate(756,462)"><rect width="292" height="142" rx="20" fill="#fff" stroke="#e5e7eb"/><circle cx="42" cy="38" r="28" fill="#152a4d"/><text x="42" y="48" fill="#fff" font-size="30">3</text><text x="146" y="72">表情が</text><text x="146" y="108">疲れて見えないか</text></g>
    <g transform="translate(74,644)"><rect width="292" height="142" rx="20" fill="#fff" stroke="#e5e7eb"/><circle cx="42" cy="38" r="28" fill="#152a4d"/><text x="42" y="48" fill="#fff" font-size="30">4</text><text x="146" y="72">姿勢が</text><text x="146" y="108">悪くないか</text></g>
    <g transform="translate(415,644)"><rect width="292" height="142" rx="20" fill="#fff" stroke="#e5e7eb"/><circle cx="42" cy="38" r="28" fill="#152a4d"/><text x="42" y="48" fill="#fff" font-size="30">5</text><text x="146" y="72">怖そう・怒って</text><text x="146" y="108">見えないか</text></g>
    <g transform="translate(756,644)"><rect width="292" height="142" rx="20" fill="#fff" stroke="#e5e7eb"/><circle cx="42" cy="38" r="28" fill="#152a4d"/><text x="42" y="48" fill="#fff" font-size="30">6</text><text x="146" y="72">生活感が</text><text x="146" y="108">強すぎないか</text></g>
  </g>

  <g transform="translate(46,866)">
    <rect width="472" height="232" rx="28" fill="#f8fafc" stroke="#a7a7a7" stroke-width="3"/>
    <rect x="96" y="-24" width="280" height="48" rx="22" fill="#707070"/>
    <text x="236" y="9" text-anchor="middle" class="title white" font-size="28">伝わりにくい写真</text>
    <text x="58" y="96" text-anchor="middle" class="text brown" font-size="24">暗い照明</text>
    <text x="177" y="96" text-anchor="middle" class="text brown" font-size="24">ヨレた服</text>
    <text x="299" y="96" text-anchor="middle" class="text brown" font-size="24">散らかった背景</text>
    <text x="417" y="96" text-anchor="middle" class="text brown" font-size="24">怖い表情</text>
    <text x="236" y="170" text-anchor="middle" class="small muted" font-size="24">近寄りにくさにつながる</text>
  </g>
  <path d="M538 982h82" stroke="#e8799a" stroke-width="24" stroke-linecap="round"/><path d="M620 982l-44-38v76z" fill="#e8799a"/>
  <g transform="translate(604,866)">
    <rect width="472" height="232" rx="28" fill="#fff" stroke="#e8799a" stroke-width="3"/>
    <rect x="96" y="-24" width="280" height="48" rx="22" fill="url(#pink)"/>
    <text x="236" y="9" text-anchor="middle" class="title white" font-size="28">伝わりやすい写真</text>
    <text x="58" y="96" text-anchor="middle" class="text brown" font-size="24">明るい照明</text>
    <text x="177" y="96" text-anchor="middle" class="text brown" font-size="24">清潔な服</text>
    <text x="299" y="96" text-anchor="middle" class="text brown" font-size="24">スッキリ背景</text>
    <text x="417" y="96" text-anchor="middle" class="text brown" font-size="24">優しい表情</text>
    <text x="236" y="170" text-anchor="middle" class="small muted" font-size="24">安心感につながる</text>
  </g>

  <rect x="52" y="1142" width="1018" height="128" rx="28" fill="#fff" stroke="#152a4d" stroke-width="4"/>
  <rect x="88" y="1118" width="174" height="54" rx="18" fill="#152a4d"/>
  <text x="175" y="1155" text-anchor="middle" class="title white" font-size="30">ポイント</text>
  <text x="292" y="1190" class="text navy" font-size="28">本当の人柄より先に、写真の印象が見られます。</text>
  <text x="292" y="1232" class="small brown" font-size="24">暗い写真、ヨレた服、散らかった背景は、それだけで近寄りにくさにつながります。</text>

  <rect x="36" y="1302" width="1050" height="72" rx="24" fill="url(#pink)"/>
  <text x="561" y="1348" text-anchor="middle" class="title white" font-size="30">まずは「清潔感・安心感・話しかけやすさ」が伝わる写真に整えましょう。</text>
</svg>